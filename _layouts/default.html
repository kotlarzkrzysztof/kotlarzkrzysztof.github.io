<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}">
  <script>
    (function(){
      try{
        var s = localStorage.getItem('pb-theme');
        var t = s || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch(e){}
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="navbar">
    <div class="container nav-flex">
      <a href="{{ '/' | relative_url }}" class="brand-name">{{ site.author.name | default: "Your Name" }}</a>
      <div class="nav-actions">
        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <ul class="nav-menu" id="site-nav">
          <li><a href="{{ '/' | relative_url }}#research">Research</a></li>
          <li><a href="{{ '/' | relative_url }}#publications">Publications</a></li>
          <li><a href="{{ '/' | relative_url }}#conferences">Conferences</a></li>
          <li><a href="{{ '/' | relative_url }}#contact">Contact</a></li>
          <li><a href="/assets/CV_KK.pdf" target="_blank" rel="noopener" class="cv-link">CV</a></li>
          <li class="nav-item-toggle">
            <button class="icon-btn" data-theme-toggle type="button" aria-label="Toggle dark mode">
              <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
              <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </header>

  <main id="main-content" class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <strong>{{ site.author.name }}</strong>
        <span>{{ site.author.role }}</span>
      </div>

      <div class="footer-links">
        <a href="mailto:{{ site.email }}">Email</a>
        <a href="https://scholar.google.com/citations?hl=en&user=fhJnkk4AAAAJ&view_op=list_works&sortby=pubdate" target="_blank" rel="noopener">Scholar</a>
        <a href="https://github.com/kotlarzkrzysztof" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.linkedin.com/in/krzysztof-kotlarz-phd-5a24bb236" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>

    <div class="container">
      <p class="footer-meta">© {{ site.time | date: "%Y" }} {{ site.author.name }} · Built as a static site.</p>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>

</body>
</html>
